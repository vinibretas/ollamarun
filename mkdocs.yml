site_name: ollamarun
site_url: https://vinibretas.github.io/ollamarun/
site_description: >-
  A terminal agent harness for Ollama — a drop-in ollama run superset with an
  approval-gated tool loop, persistent sessions, live rendering and an
  OpenAI-compatible API layer.
copyright: Apache-2.0 — provided as is, with no warranty.

repo_url: https://github.com/vinibretas/ollamarun
repo_name: vinibretas/ollamarun
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

validation:
  links:
    anchors: warn

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.action.edit
    - content.action.view
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md

  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md

  - CLI:
      - Overview: cli/index.md
      - Usage and flags: cli/usage.md
      - The REPL: cli/repl.md
      - "@file mentions": cli/file-mentions.md
      - Images and vision: cli/images.md
      - Editor: cli/editor.md
      - Pager: cli/pager.md
      - Slash commands: cli/commands.md
      - Tools:
          - Overview: cli/tools/index.md
          - The tool loop: cli/tools/tool-loop.md
          - Approvals and policy: cli/tools/approvals.md
          - Definitions: cli/tools/definitions.md
          - Reference: cli/tools/reference.md
      - Rendering:
          - Streaming markdown: cli/rendering/markdown.md
          - 2D math: cli/rendering/math.md
          - Thinking panel: cli/rendering/thinking.md
          - Waiting for the model: cli/rendering/waiting.md
          - Footer: cli/rendering/footer.md
          - Transcript replay: cli/rendering/transcript.md
      - Sessions:
          - Storage: cli/sessions/storage.md
          - Background sessions: cli/sessions/background.md
          - Save and load: cli/sessions/save-load.md
          - Undo, retry and edit: cli/sessions/undo-retry-edit.md
          - Branching: cli/sessions/branching.md
          - Search and export: cli/sessions/search-export.md
          - Titles and tags: cli/sessions/titles-tags.md
      - Models:
          - Picker and sorting: cli/models/picker.md
          - Pulling models: cli/models/pulling.md
          - Load, unload and residency: cli/models/housekeeping.md
          - Parameters: cli/models/parameters.md
          - Embeddings: cli/models/embeddings.md
      - Context and placement:
          - Overview and warnings: cli/context/overview.md
          - Compaction: cli/context/compaction.md
          - num-ctx: cli/context/num-ctx.md
          - max-gpu: cli/context/max-gpu.md
          - max-cpu: cli/context/max-cpu.md
          - Probes and calibration: cli/context/probes.md
          - GPU layers: cli/context/gpu-layers.md
      - Remote inference: cli/remote.md

  - API:
      - Overview: api/index.md
      - OpenAI API:
          - Models: api/openai/models.md
          - Chat completions: api/openai/chat-completions.md
          - Streaming: api/openai/streaming.md
          - Tool calls: api/openai/tools.md
          - "n > 1 choices": api/openai/n-choices.md
          - Embeddings: api/openai/embeddings.md
          - Vision: api/openai/vision.md
          - Errors: api/openai/errors.md
      - Agent API:
          - Turns: api/agent/turns.md
          - Event stream: api/agent/events.md
          - Approvals: api/agent/approvals.md
          - Sessions: api/agent/sessions.md
          - Artifacts: api/agent/artifacts.md
          - Context fits: api/agent/fits.md
      - Security and limits: api/security.md
      - Example clients: api/example-clients.md

  - TUI:
